<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Address not found — Wren &amp; Holt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#14181C;
  --stone:#F4EFE6;
  --stone-dim:#EAE3D4;
  --brass:#B08D57;
  --brass-light:#D3B487;
  --sage-light:#7C9186;
  --line-dark:#3A4046;
  --text-soft:#5C6360;

  --serif:'Instrument Serif', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'IBM Plex Mono', monospace;

  --radius: 2px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans);
  color:var(--stone);
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}
}

/* ============ SHARED ============ */
.eyebrow{
  font-family:var(--mono);
  font-size:.72rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--brass-light);
  margin-bottom:14px;
  display:inline-block;
}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;
  font-family:var(--mono);
  font-size:.82rem;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-radius:var(--radius);
  transition:transform .35s var(--ease), background .3s, color .3s, border-color .3s;
  white-space:nowrap;
}
.btn-brass{background:var(--brass);color:var(--ink);}
.btn-brass:hover{background:var(--brass-light);transform:translateY(-2px);}
.btn-outline-light{border:1px solid var(--line-dark);color:var(--stone);}
.btn-outline-light:hover{background:var(--stone);color:var(--ink);transform:translateY(-2px);}

/* scroll reveal */
.reveal{
  opacity:0;
  transform:translateY(26px);
  transition:opacity .8s var(--ease), transform .8s var(--ease);
  transition-delay:calc(var(--d,0) * 90ms);
}
.reveal.in{opacity:1;transform:translateY(0);}

/* small in-page brand mark */
.logo-mark{
  font-family:var(--mono);font-size:.78rem;
  border:1px solid var(--brass);color:var(--brass);
  padding:5px 8px;letter-spacing:.05em;
}
.logo-text{font-family:var(--serif);font-size:1.3rem;color:var(--stone);}
.logo-text em{font-style:italic;color:var(--brass-light);}

/* ============ 404 ============ */
.notfound{
  position:relative;min-height:100vh;
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:60px 24px;
  overflow:hidden;
}
.notfound-logo{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:44px;
}
.notfound-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line-dark) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-dark) 1px, transparent 1px);
  background-size:44px 44px;
  opacity:.16;
  mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
}
.notfound-inner{
  position:relative;z-index:2;max-width:620px;text-align:center;
}
.notfound-numeral{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(6rem,16vw,10rem);
  line-height:1;
  color:transparent;
  -webkit-text-stroke:1.5px var(--brass-light);
  letter-spacing:.02em;
  margin-bottom:8px;
  opacity:.9;
}
.notfound-title{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.9rem,4vw,2.6rem);
  line-height:1.15;margin-bottom:18px;
}
.notfound-sub{
  color:var(--stone-dim);font-size:1.02rem;line-height:1.65;
  max-width:460px;margin:0 auto 36px;
}
.notfound-actions{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;
}
.notfound-code{
  font-family:var(--mono);font-size:.72rem;color:var(--text-soft);
  text-transform:uppercase;letter-spacing:.06em;
}

.notfound-pin{
  position:absolute;bottom:-30px;right:4%;z-index:1;
  width:min(300px, 34vw);opacity:.9;
  display:none;
}
.pin-ring{fill:none;stroke:var(--sage-light);stroke-width:1;opacity:0;}
.pin-ring-1{animation:pinPulse 2.6s ease-out infinite;}
.pin-ring-2{animation:pinPulse 2.6s ease-out infinite .5s;}
.pin-ring-3{animation:pinPulse 2.6s ease-out infinite 1s;}
@keyframes pinPulse{
  0%{opacity:.5;transform:scale(.7);transform-origin:120px 150px;}
  100%{opacity:0;transform:scale(1.15);transform-origin:120px 150px;}
}
.pin-body{
  fill:none;stroke:var(--brass-light);stroke-width:1.5;
  stroke-dasharray:600;stroke-dashoffset:600;
  animation:drawPin 1.8s var(--ease) forwards .3s;
}
.pin-hole{
  fill:none;stroke:var(--brass-light);stroke-width:1.5;
  stroke-dasharray:110;stroke-dashoffset:110;
  animation:drawPin 1s var(--ease) forwards 1.6s;
}
@keyframes drawPin{to{stroke-dashoffset:0;}}

@media (min-width:860px){
  .notfound-pin{display:block;}
}

/* ============ RESPONSIVE ============ */
@media (max-width:720px){
  .notfound-actions{flex-direction:column;align-items:stretch;}
  .notfound-actions .btn{justify-content:center;}
}

@media (max-width:480px){
  .notfound{padding:48px 18px;}
  .notfound-numeral{font-size:4.4rem;}
  .notfound-title{font-size:1.5rem;}
  .notfound-logo{margin-bottom:32px;}
}
</style>
</head>
<body>

<!-- ================= 404 ================= -->
<section class="notfound">
  <div class="notfound-grid" aria-hidden="true"></div>

  <div class="notfound-inner">
    <a href="index.html" class="notfound-logo reveal">
      <span class="logo-mark">W&amp;H</span>
      <span class="logo-text">Wren <em>&amp;</em> Holt</span>
    </a>

    <p class="eyebrow reveal" style="--d:1">Error 404</p>

    <div class="notfound-numeral reveal" style="--d:2">404</div>

    <h1 class="notfound-title reveal" style="--d:3">This address doesn't exist.</h1>
    <p class="notfound-sub reveal" style="--d:4">
      The listing you're looking for has been sold, delisted, or never made it
      onto our books. Let's find you a better one.
    </p>

    <div class="notfound-actions reveal" style="--d:5">
      <a href="index.html" class="btn btn-brass"><i class="fa-solid fa-house"></i> Back to homepage</a>
      <a href="index.html#listings" class="btn btn-outline-light"><i class="fa-solid fa-magnifying-glass"></i> Browse listings</a>
    </div>

    <p class="notfound-code reveal" style="--d:6">Error code: 404 · Property record not found</p>
  </div>

  <div class="notfound-pin" aria-hidden="true">
    <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="pin-ring pin-ring-1" cx="120" cy="150" r="34"/>
      <circle class="pin-ring pin-ring-2" cx="120" cy="150" r="60"/>
      <circle class="pin-ring pin-ring-3" cx="120" cy="150" r="86"/>
      <path class="pin-body" d="M120 44 C88 44 62 70 62 102 C62 146 120 196 120 196 C120 196 178 146 178 102 C178 70 152 44 120 44 Z"/>
      <circle class="pin-hole" cx="120" cy="100" r="16"/>
    </svg>
  </div>
</section>

<script>
// ================= SCROLL REVEAL =================
const revealEls = document.querySelectorAll('.reveal');
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting){
      entry.target.classList.add('in');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold:0.15, rootMargin:'0px 0px -60px 0px' });

revealEls.forEach(el => revealObserver.observe(el));
</script>
</body>
</html>
